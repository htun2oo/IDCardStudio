name: Build ID Card Studio (x64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore IDCardStudio/IDCardStudio.csproj

    - name: Build Project (Release x64)
      run: dotnet build IDCardStudio/IDCardStudio.csproj -c Release -r win-x64 --no-restore

    - name: Publish Self-Contained Executable
      run: |
        dotnet publish IDCardStudio/IDCardStudio.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true --output ./publish

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: IDCardStudio-Windows-x64
        path: ./publish/
