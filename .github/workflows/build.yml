name: Build ID Card Studio (x64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore -r win-x64

    - name: Build Project (Release x64)
      run: dotnet build -c Release -r win-x64

    - name: Publish Self-Contained Executable
      run: dotnet publish -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true --output ./publish

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: IDCardStudio-Windows-x64
        path: ./publish/
